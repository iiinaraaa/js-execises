<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>party invite</title>
    <link rel="icon" href="assets/img/favicon (4).ico" type="image/x-icon">
</head>
<body>
    <div class="partyInvite">
        <h1 class="partyInvite__title">⋆✴︎˚｡⋆ Sistema de entrada ⋆✴︎˚｡⋆</h1>

        <form class="partyInvite__ageContent">
            <label class="partyInvite__ageContentTitle">Idade:</label>
            <input class="partyInvite__ageContentNumber" type="number" id="idade">
        </form>

        <form class="partyInvite__choise">
            <label partyInvite__choiseTitle>Tem convite?</label>
    
            <label class="opcoes partyInvite__choiseContainer">
                <input class="partyInvite__choiseContainerRadio" type="radio" name="convite" value="sim" id="sim">
                <label class="partyInvite__choiseContainerRadioButton" for="sim" class="radio-botao">Sim</label>

                <input class="partyInvite__choiseContainerRadio" type="radio" name="convite" value="nao" id="nao">
                <label class="partyInvite__choiseContainerRadioButton" for="nao" class="radio-botao">Nao</label>
            </label>
        </form>

        <button class="partyInvite__button" onclick="verificarEntrada()">Verificar</button>

        <h2 class="partyInvite__result" id="resultado"></h2>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
