<!DOCTYPE html>
<html lang="en">
<head>
    <base href="./" target="_blank">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/styles.css">
    <title>digital wallet</title>
    <link rel="icon" href="./assets/img/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="wallet">
        <header class="wallet__header">
            <div class="header__imageRadious">
                <img class="header__image" src="assets/img/wallet-svgrepo-com (1).svg" alt="">
            </div>
            
            <h1 class="wallet__title">Carteira digital</h1>
        </header>

        <div class="addMoneySection">
            <div class="addMoneySection__value">
                <p class="addMoneySection__valueTitle">Saldo disponivel:</p> 

                <p class="addMoneySection__valueAvailable">
                    R$ <span id="conta_corrente"> 0</span>
                </p>
            </div>
            
            <div class="addMoneyContainer__options">
                <div class="addMoneyContainer__optionsContainer">
                    
                   <button class="addMoney__addMoneyButton" onclick="adicionarDinheiro()"><img class="addMoney__image" src="assets/img/unpublish-svgrepo-com.svg" alt=""> Depositar</button> 
                </div>

                <div class="addMoneyContainer__optionsContainer">
                    
                    <button class="addMoney__addMoneyButton" onclick="render()"><img class="addMoney__image" src="assets/img/trend-upward-svgrepo-com.svg" alt=""> Render</button>
                </div>
            </div>
        </div>

        <div class="wallet__boxes">
            <h3 class="wallet__boxesTitle">Minhas caixinhas</h3>

            <div class="wallet__boxesValues">
                <p class="wallet__boxesValuesItem">Lazer: R$ <span id="lazer">0</span></p>
                <p class="wallet__boxesValuesItem">Pet: R$ <span id="pet">0</span></p>
                <p class="wallet__boxesValuesItem">Faculdade: R$ <span id="faculdade">0</span></p>
            </div>
        </div>

        <div class="allocateSection">
            <h3 class="allocateSection__title">Investir</h3>

            <div class="wallet__buttons">
                <button class="wallet__buttonsItem" onclick="separar('lazer')"> <img class="wallet__buttonsImage" src="assets/img/lazer.svg" alt="">Lazer</button>
                <button class="wallet__buttonsItem" onclick="separar('pet')"> <img class="wallet__buttonsImage" src="assets/img/pet.svg" alt="">Pet</button>
                <button class="wallet__buttonsItem" onclick="separar('faculdade')"> <img class="wallet__buttonsImage" src="assets/img/faculdade.svg" alt="">Faculdade</button>
            </div>
        </div>

        <div class="withdrawSection">
            <h3 class="withdraw__title">Retirar Dinheiro</h3>

            <div class="withdraw__buttonsWrapper">
                <button class="withdraw__buttons" onclick="retirar('lazer')"><img class="wallet__buttonsImage" src="assets/img/lazer.svg" alt="">Lazer</button>
                <button class="withdraw__buttons" onclick="retirar('pet')"><img class="wallet__buttonsImage" src="assets/img/pet.svg" alt="">Pet</button>
                <button class="withdraw__buttons" onclick="retirar('faculdade')"><img class="wallet__buttonsImage" src="assets/img/faculdade.svg" alt="">Faculdade</button>
            </div>
        </div>

        <div class="history">
            <button class="history__button" onclick="mostrarHistorico()"> <img class="history__buttonImage" src="assets/img/history.svg" alt="">Ver Historico</button>

            <div class="history__buttonStyling" id="tela_historico" style="display: none;">
                
                <button class="history__button" onclick="fecharHistorico()"><img class="history__closeButtonImage" src="assets/img/close.svg" alt="">fechar</button>
                <div class="history__list" id="lista_historico"></div>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
