<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/styles.css">
    <title>digital wallet</title>
    <link rel="icon" href="./assets/img/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="wallet">
        <header class="wallet__header">
            <div class="header__imageRadious">
                <img class="header__image" src="assets/img/wallet-svgrepo-com (1).svg" alt="">
            </div>
            
            <h1 class="wallet__title">Carteira digital</h1>
        </header>

        <div class="addMoneySection">
            <div class="addMoneySection__value">
                <p class="addMoneySection__valueTitle">Saldo disponivel:</p> 

                <p class="addMoneySection__valueAvailable">
                    R$ <span id="conta_corrente"> 0</span>
                </p>
            </div>
            
            <div class="addMoneyContainer__options">
                <div class="addMoneyContainer__optionsContainer">
                    <!-- depositar dinheiro -->
                   <button class="addMoney__addMoneyButton" onclick="adicionarDinheiro()"><img class="addMoney__image" src="assets/img/unpublish-svgrepo-com.svg" alt=""> Depositar</button> 

                   <!-- sacar dinheiro -->
                   <button class="addMoney__addMoneyButton" onclick="sacarDinheiro()"><img class="addMoney__image" src="assets/img/historyIcons/takeMoneyHistory.svg" alt=""> Sacar</button> 
                </div>
            </div>
        </div>

        <div class="wallet__boxes">
            <div class="wallet__boxesHeader">
                <h3 class="wallet__boxesTitle">Minhas caixinhas</h3>
                <button class="addMoney__earnButton" onclick="render()"><img class="addMoney__image" src="assets/img/trend-upward-svgrepo-com.svg" alt=""> Render</button>
            </div>
            

            <div class="wallet__boxesValues">
                <div class="wallet__boxesItem">
                    <img class="wallet__boxesImage" src="assets/img/lazer.svg" alt="">
                    <p class="wallet__boxesValuesItem">Lazer: R$ <span id="lazer">0</span></p>

                    <!-- colocar dinheiro -->
                    <button class="wallet__buttonsItem" onclick="separar('lazer')"> <img class="wallet__buttonsImage" src="assets/img/historyIcons/putMoneyHistory.svg" alt=""></button>

                    <!-- tirar dinheiro -->
                    <button class="wallet__buttonsItem" onclick="retirar('lazer')"><img class="wallet__buttonsImage" src="assets/img/historyIcons/takeMoneyHistory.svg" alt=""></button>
                </div>

                <div class="wallet__boxesItem">
                    <img class="wallet__boxesImage" src="assets/img/pet.svg" alt="">
                    <p class="wallet__boxesValuesItem">Pet: R$ <span id="pet">0</span></p>

                    <!-- colocar dinheiro -->
                    <button class="wallet__buttonsItem" onclick="separar('pet')"> <img class="wallet__buttonsImage" src="assets/img/historyIcons/putMoneyHistory.svg" alt=""></button>

                    <!-- tirar dinheiro -->
                    <button class="wallet__buttonsItem" onclick="retirar('pet')"><img class="wallet__buttonsImage" src="assets/img/historyIcons/takeMoneyHistory.svg" alt=""></button>
                </div>

                <div class="wallet__boxesItem">
                    <img class="wallet__boxesImage" src="assets/img/faculdade.svg" alt="">
                    <p class="wallet__boxesValuesItem">Facul: R$ <span id="faculdade">0</span></p>
                    
                    <!-- colocar dinheiro -->
                    <button class="wallet__buttonsItem" onclick="separar('faculdade')"> <img class="wallet__buttonsImage" src="assets/img/historyIcons/putMoneyHistory.svg" alt=""></button>

                    <!-- tirar dinheiro -->
                    <button class="wallet__buttonsItem" onclick="retirar('faculdade')"><img class="wallet__buttonsImage" src="assets/img/historyIcons/takeMoneyHistory.svg" alt=""></button>
                </div>
            </div>
        </div>

        <div class="history">
            <button class="history__button" id="btnHistorico" onclick="toggleHistorico()">
                <img class="history__buttonImage" id="iconHistorico" src="assets/img/close.svg" alt="">
                <span id="textoHistorico">Ver historico</span>
            </button>

            <div class="history__buttonStyling" id="tela_historico" style="display: none;">
                <div class="history__list" id="lista_historico"></div>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
