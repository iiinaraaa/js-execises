<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/favicon.svg" type="image/png">
    <title>Weather</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="weather" id="weatherBackground">
        <header class="weather__header">
            <div class="weather__location">

                <img src="assets/img/icons/localization.svg" alt=""> 

                <!-- searchbar -->
                <div class="weather__searchWrapper">
                    <input 
                        type="text"
                        id="citySearch"
                        class="weather__searchInput"
                        placeholder="Search city..."
                    >

                    <div 
                        class="weather__suggestions"
                        id="suggestions"
                    ></div>
                </div>
            </div>

            <img class="weather__headerProfile" src="assets/img/profile.svg" alt="">
        </header>

        <div class="weather__main">
            <!-- parte que fica o hero de vdd -->
            <div class="weather__hero">

                <p 
                    class="weather__status"
                    id="status"
                >
                    Cloudy
                </p>

                <img 
                    class="weather__icon"
                    id="mainIcon"
                    src="assets/img/icons/weatherIcons/cloudy.svg" 
                    alt=""
                >

                <p 
                    class="weather__temperature"
                    id="temperature"
                >
                    26 °C
                </p>

                <p 
                    class="weather__date"
                    id="date"
                >
                    Sunday | 12 Dec 2023
                </p>
            </div>

            <!-- carrossel da semana -->
            <div 
                class="weather__carousel"
                id="mobileForecast"
            >
                <img class="weather__carouselArrow" src="assets/img/icons/leftArrow.svg" alt="">

                <div class="weather__carouselItem">
                    <p class="weather__carouselDay">FRI</p>

                    <img 
                        class="weather__carouselIcon"
                        src="assets/img/icons/weatherIcons/rainCloud.svg" 
                        alt=""
                    >
                </div>

                <div class="weather__carouselItem">
                    <p class="weather__carouselDay">SAT</p>

                    <img 
                        class="weather__carouselIcon"
                        src="assets/img/icons/weatherIcons/sun.svg" 
                        alt=""
                    >
                </div>

                <div class="weather__carouselItem">
                    <p class="weather__carouselDay">SUN</p>

                    <img 
                        class="weather__carouselIcon"
                        src="assets/img/icons/weatherIcons/cloudy.svg" 
                        alt=""
                    >
                </div>

                <div class="weather__carouselItem">
                    <p class="weather__carouselDay">MON</p>

                    <img 
                        class="weather__carouselIcon"
                        src="assets/img/icons/weatherIcons/rainyCloudyDay.svg" 
                        alt=""
                    >
                </div>

                <div class="weather__carouselItem">
                    <p class="weather__carouselDay">TUES</p>

                    <img 
                        class="weather__carouselIcon"
                        src="assets/img/icons/weatherIcons/thunderCloud.svg" 
                        alt=""
                    >
                </div>

                <img class="weather__carouselArrow" src="assets/img/icons/rightArrow.svg" alt="">
            </div>
        </div>

        <!-- side bar inicio -->
        <div class="weather__mainWrapper">
            <div class="weather__sideBar">
                <div class="weather__profile">

                    <img class="weather__profileImage" src="assets/img/profile.svg" alt="">
                </div>

                <div class="weather__profileIcons">
                    <img class="weather__sideBarIcon" src="assets/img/icons/weather.svg" alt="">
                    <img class="weather__sideBarIcon" src="assets/img/icons/explore.svg" alt="">
                    <img class="weather__sideBarIcon" src="assets/img/icons/localization.svg" alt="">
                    <img class="weather__sideBarIcon" src="assets/img/icons/settings.svg" alt="">
                </div>
            </div>
            <!-- side bar final -->

            <!-- locations inicio -->
            <div class="weather__locations">
                <p class="weather__locationsTitle">
                    <img class="weather__locationsTitleIcon" src="assets/img/icons/heart.svg" alt="">
                    Activities in your area
                </p>

                <div class="weather__locationsCards">
                    <div class="weather__locationsCard">
                        <img class="weather__locationsImage" src="assets/img/places/park.svg" alt="">
                        <p class="weather__locationsDistance">2km away</p>
                    </div>

                    <div class="weather__locationsCard">
                        <img class="weather__locationsImage" src="assets/img/places/fallPark.svg" alt="">
                        <p class="weather__locationsDistance">1.5km away</p>
                    </div>

                    <div class="weather__locationsCard">
                        <img class="weather__locationsImage" src="assets/img/places/waterPark.svg" alt="">
                        <p class="weather__locationsDistance">3km away</p>
                    </div>

                    <div class="weather__locationsCard">
                        <img class="weather__locationsImage" src="assets/img/places/beach.svg" alt="">
                        <p class="weather__locationsDistance">500m away</p>
                    </div>
                </div>
            </div>
            <!-- locations final -->

            <!-- weeklyForecast inicio -->
            <div class="weather__weeklyForecast">
                <div 
                    class="weather__weeklyForecastCarousel"
                    id="forecast"
                >

                    <img 
                        class="weather__weeklyForecastCarouselArrow" 
                        src="assets/img/icons/leftArrow.svg" 
                        alt=""
                    >

                    <div class="weather__weeklyForecastCarouselItem">
                        <p class="weather__weeklyForecastCarouselDay">
                            FRI
                        </p>

                        <img 
                            class="weather__weeklyForecastCarouselIcon"
                            src="assets/img/icons/weatherIcons/rainCloud.svg" 
                            alt=""
                        >
                    </div>

                    <div class="weather__weeklyForecastCarouselItem">
                        <p class="weather__weeklyForecastCarouselDay">
                            SAT
                        </p>

                        <img 
                            class="weather__weeklyForecastCarouselIcon"
                            src="assets/img/icons/weatherIcons/sun.svg" 
                            alt=""
                        >
                    </div>

                    <div class="weather__weeklyForecastCarouselItem">
                        <p class="weather__weeklyForecastCarouselDay">
                            SUN
                        </p>

                        <img 
                            class="weather__weeklyForecastCarouselIcon"
                            src="assets/img/icons/weatherIcons/cloudy.svg" 
                            alt=""
                        >
                    </div>

                    <div class="weather__weeklyForecastCarouselItem">
                        <p class="weather__weeklyForecastCarouselDay">
                            MON
                        </p>

                        <img 
                            class="weather__weeklyForecastCarouselIcon"
                            src="assets/img/icons/weatherIcons/rainyCloudyDay.svg" 
                            alt=""
                        >
                    </div>

                    <div class="weather__weeklyForecastCarouselItem">
                        <p class="weather__weeklyForecastCarouselDay">
                            TUES
                        </p>

                        <img 
                            class="weather__weeklyForecastCarouselIcon"
                            src="assets/img/icons/weatherIcons/thunderCloud.svg" 
                            alt=""
                        >
                    </div>

                    <img 
                        class="weather__weeklyForecastCarouselArrow" 
                        src="assets/img/icons/rightArrow.svg" 
                        alt=""
                    >
                </div>

                <p 
                    class="weather__weeklyForecastTime"
                    id="time"
                >
                    <img 
                        class="weather__weeklyForecastTimeIcon"
                        src="assets/img/icons/hour.svg" 
                        alt=""
                    >

                    8:00PM GMT
                </p>

                <div class="weather__weeklyForecastAirConditions">
                    <p class="weather__weeklyForecastAirConditionsTitle">
                        AIR CONDITIONS
                    </p>

                    <div class="weather__weeklyForecastAirCondition">
                        <img 
                            class="weather__weeklyForecastAirConditionIcon"
                            src="assets/img/icons/thermometer.svg" 
                            alt=""
                        >

                        <div class="weather__weeklyForecastAirConditionInfo">
                            <p class="weather__weeklyForecastAirConditionTitle">
                                Real Feel
                            </p>

                            <p 
                                class="weather__weeklyForecastAirConditionValue"
                                id="feelsLike"
                            >
                                30°
                            </p>
                        </div>

                    </div>

                    <div class="weather__weeklyForecastAirCondition">
                        <img 
                            class="weather__weeklyForecastAirConditionIcon"
                            src="assets/img/icons/wind.svg" 
                            alt=""
                        >

                        <div class="weather__weeklyForecastAirConditionInfo">
                            <p class="weather__weeklyForecastAirConditionTitle">
                                Wind
                            </p>

                            <p 
                                class="weather__weeklyForecastAirConditionValue"
                                id="wind"
                            >
                                0.8 km/hr
                            </p>
                        </div>
                    </div>

                    <div class="weather__weeklyForecastAirCondition">
                        <img 
                            class="weather__weeklyForecastAirConditionIcon"
                            src="assets/img/icons/rain.svg" 
                            alt=""
                        >

                        <div class="weather__weeklyForecastAirConditionInfo">
                            <p class="weather__weeklyForecastAirConditionTitle">
                                Humidity
                            </p>

                            <p 
                                class="weather__weeklyForecastAirConditionValue"
                                id="humidity"
                            >
                                2%
                            </p>
                        </div>
                    </div>

                    <div class="weather__weeklyForecastAirCondition">
                        <img 
                            class="weather__weeklyForecastAirConditionIcon"
                            src="assets/img/icons/sun.svg" 
                            alt=""
                        >

                        <div class="weather__weeklyForecastAirConditionInfo">
                            <p class="weather__weeklyForecastAirConditionTitle">
                                UV Index
                            </p>

                            <p 
                                class="weather__weeklyForecastAirConditionValue"
                                id="uv"
                            >
                                4
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- weeklyForecast final -->
    </div>

    <script src="main.js"></script>
</body>
</html>
